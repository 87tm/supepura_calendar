<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宇宙∞プラネクシア カレンダー</title>

  <meta name="description" content="宇宙∞プラネクシア（すぺぷら）のライブイベント情報をカレンダーで確認できるサイトです。出演情報・特典会・チケット情報などを掲載しています。">

  <meta property="og:title" content="宇宙∞プラネクシア カレンダー">
  <meta property="og:description" content="宇宙∞プラネクシア（すぺぷら）のライブイベント情報をカレンダーで確認できます。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://87tm.github.io/supepura_calendar/">
  <meta property="og:image" content="https://87tm.github.io/supepura_calendar/images/IMG_5834.jpg">

  <meta name="twitter:card" content="summary">

  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="style.css?v=20260309">
  <style>
    .calendar { 
        display: grid; 
        grid-template-columns: repeat(7, minmax(0,1fr)); 
        gap: 4px; 
    } 
    .day { 
        border: 1px solid #ddd; 
    } 
    .day-number { 
        font-weight: bold; 
        margin-bottom: 2px; 
    } 

  </style>
</head>
<body>

    <!-- 背景 -->
  <div class="page-bg"></div>

  <!-- 全体ラッパー -->
  <div class="calendar-wrapper">

    <!-- ヘッダー -->
    <div class="calendar-header">
  <img src="images/IMG_3743.png" class="calendar-logo">
  <span class="calendar-title-bg">
    <h2 class="calendar-group-name">宇宙∞プラネクシア</h2>
  </span>
</div>

    <!-- 月切り替え -->
    <div id="calendar-header">
  <button id="prev-month">＜</button>

  <span class="month-bg">
    <span id="current-month"></span>
  </span>

  <button id="next-month">＞</button>
</div>

    <!-- 曜日 -->
    <div class="calendar-box">
        <div class="calendar weekdays" id="weekdays"></div>
        <div class="calendar" id="calendar"></div>
    </div>

    <div id="today-event" class="today-event-card"></div>
    <div id="ticket-start-list" class="today-event-card"></div>
    <a href="schedule.html" class="schedule-link-card">
        <div class="schedule-link-sub">
            ライブ一覧を見る
        </div>
    </a>

  </div>


<script>
let currentDate = new Date();
const calendar = document.getElementById("calendar");

async function loadEvents(){

  // ✅ ① まずキャッシュを即表示（爆速）
  let cache = null;
  try{
    cache = localStorage.getItem("eventsCache");
  }catch(e){
    console.warn("キャッシュ取得失敗");
  }
  if(cache){
    try{
      const parsed = JSON.parse(cache);

      // ✅ 画像データが存在するかチェック
      const hasImageData = parsed.some(e =>
      Array.isArray(e.images) && e.images.length > 0
    );

    // ❌ 画像が1つもないキャッシュは使わない
    if(!hasImageData){
      throw new Error("old cache");
    }

    events = parsed;

      eventsByDate = {};
      events.forEach(e=>{
        if(!e.date || !/^\d{4}-\d{2}-\d{2}$/.test(e.date)) return;

        if(!eventsByDate[e.date]) eventsByDate[e.date]=[];
        eventsByDate[e.date].push(e);
      });

      renderCalendar();
      renderTodayEvent();
      renderTicketCards();

    }catch(e){
      console.warn("キャッシュ壊れてるので削除");

      // ✅ 壊れたキャッシュ削除
      try{
        localStorage.removeItem("eventsCache");
      }catch(e){}

      events = [];
    }
  }

  // ✅ ② その後に最新データ取得（裏で更新）
  try{
    const fresh = await fetch("https://event-api.t87.workers.dev/events")
      .then(r => r.json());

    events = fresh;
    try{
      const data = JSON.stringify(events);

      // ✅ 容量制限（約4MB）超えたら保存しない
      if(data.length < 4000000){
        localStorage.setItem("eventsCache", data);
      }else{
        console.warn("キャッシュ大きすぎて保存スキップ");
      }

    }catch(e){
      console.warn("キャッシュ保存失敗");
    }

    eventsByDate = {};
    events.forEach(e=>{
      if(!e.date || !/^\d{4}-\d{2}-\d{2}$/.test(e.date)) return;

      if(!eventsByDate[e.date]) eventsByDate[e.date]=[];
      eventsByDate[e.date].push(e);
    });

    renderCalendar();
    renderTodayEvent();
    renderTicketCards();

  }catch(e){
    // 通信失敗でもキャッシュで表示済みだからOK
  }
}

let events = [];
let eventsByDate = {};

loadEvents();

const weekdaysDiv = document.getElementById("weekdays");
const weekDays = ["月","火","水","木","金","土","日"];

// 曜日ヘッダー
weekdaysDiv.innerHTML = "";
weekDays.forEach((day, index) => {
  const div = document.createElement("div");
  div.textContent = day;
  div.className = "weekday";
  if (index === 5) div.classList.add("saturday");
  if (index === 6) div.classList.add("sunday");
  weekdaysDiv.appendChild(div);
});

function renderCalendar(direction = "left") {

  if(direction === "left"){
    calendar.classList.add("calendar-slide-left");
  }else{
    calendar.classList.add("calendar-slide-right");
  }

  setTimeout(() => {

  calendar.innerHTML = "";

  const fragment = document.createDocumentFragment();
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  document.getElementById("current-month").textContent =
    `${year}年${month + 1}月`;

  const lastDay = new Date(year, month + 1, 0).getDate();

  const firstDay = new Date(year, month, 1);
  let startIndex = firstDay.getDay();

  if(startIndex === 0){
    startIndex = 6;

}else{
  startIndex = startIndex - 1;
}

  // 空白セル
  for (let i = 0; i < startIndex; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    calendar.appendChild(empty);
  }

  for (let day = 1; day <= lastDay; day++) {
    const dayDiv = document.createElement("div");
    dayDiv.className = "day";

    const dateStr =
  `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  
  const today = new Date();
const todayStr = today.getFullYear() + "-" +
  String(today.getMonth()+1).padStart(2,"0") + "-" +
  String(today.getDate()).padStart(2,"0");
  if (dateStr === todayStr) {
    dayDiv.classList.add("today");
}

    const number = document.createElement("div");
    number.className = "day-number";
    number.textContent = day;
    dayDiv.appendChild(number);

    const dayEvents = Array.isArray(eventsByDate[dateStr]) ? eventsByDate[dateStr] : [];
    
    // 🎤ライブ時間で並び替え（早い順）
    dayEvents.sort((a,b)=>{
        if(!a.stageTime || !b.stageTime) return 0;

        const getTime = (str)=>{
            const m = str.match(/(\d{1,2}):(\d{2})/);
            if(!m) return 9999;
            return parseInt(m[1])*60 + parseInt(m[2]);
        };

        return getTime(a.stageTime) - getTime(b.stageTime);
    });
    
    dayEvents.slice(0,2).forEach(event => {

  const wrapper = document.createElement("div");
  wrapper.className = "calendar-event-image";

  if(!event) return;
  // ▼ 画像がある場合
  if (
  Array.isArray(event.images) &&
  event.images.length > 0 &&
  typeof event.images[0] === "string" &&
  event.images[0].trim() !== ""
) {
  const img = document.createElement("img");
  img.loading = "lazy";

  // ✅ 画像エラーでも絶対に壊れないようにする
  img.onerror = () => {
    wrapper.classList.add("no-image");
    img.remove();
  };

  img.src = event.images[0];
  wrapper.appendChild(img);
}
else {
  wrapper.classList.add("no-image");
}

  const overlay = document.createElement("div");
  overlay.className = "event-title-overlay";
  overlay.textContent = event.title;

  wrapper.addEventListener("click", () => {
    location.href = `event.html?id=${event.id}`;
  });

  wrapper.appendChild(overlay);
  dayDiv.appendChild(wrapper);
});
if(dayEvents.length > 2){

  const badge = document.createElement("div");
  badge.className = "event-count";

  badge.textContent = `+${dayEvents.length - 2}`;

  const hiddenEvent = dayEvents[2];

  badge.addEventListener("click", () => {
    location.href = `event.html?id=${hiddenEvent.id}`;
  });

  dayDiv.appendChild(badge);

}
fragment.appendChild(dayDiv); 
} 
calendar.appendChild(fragment);

calendar.classList.remove("calendar-slide-left");
calendar.classList.remove("calendar-slide-right");

setTimeout(() => {
  calendar.style.opacity = "1";
}, 10);

}, 120);
}

document.getElementById("prev-month").onclick = () => {
  currentDate.setMonth(currentDate.getMonth() - 1);
  renderCalendar();
};

document.getElementById("next-month").onclick = () => {
  currentDate.setMonth(currentDate.getMonth() + 1);
  renderCalendar();
};

let startX = 0;
let startY = 0;
let isPinching = false;

calendar.addEventListener("touchstart", (e) => {

  if (e.touches.length > 1) {
    isPinching = true;
    return;
  }

  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;

});

calendar.addEventListener("touchend", (e) => {

  // ✅ ピンチ後の誤作動防止
  if (isPinching) {
    isPinching = false;
    return;
  }

  // ✅ 拡大状態は無効
  if (window.visualViewport && window.visualViewport.scale > 1) {
    return;
  }

  let endX = e.changedTouches[0].clientX;
  let endY = e.changedTouches[0].clientY;

  let diffX = endX - startX;
  let diffY = endY - startY;

  // ✅ 縦移動が大きい場合は無効
  if (Math.abs(diffY) > Math.abs(diffX)) {
    return;
  }

  // ✅ 横移動がしっかりある時だけ月移動
  if (diffX > 60) {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  }

  if (diffX < -60) {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  }

});

function extractTicketDate(text, eventDate){

  if(!text || !eventDate) return null;

  // event.ticketには「🎫」が保存されていないため、
  // 「🎫」がある場合とない場合の両方に対応
  const ticketText = text.includes("🎫")
    ? text.split("🎫")[1]
    : text;

  // 例:
  // 5/1(金)22:00より販売開始
  // 5/1 22:00〜
  // 5/1(金)22:00発売
  const match = ticketText.match(
    /(\d{1,2})\/(\d{1,2})\s*(?:\([^)]*\))?\s*(\d{1,2}):(\d{2})/
  );

  if(!match) return null;

  // イベント本体の日付から年を取得
  const eventDateObj = new Date(eventDate + "T00:00:00");

  let year = eventDateObj.getFullYear();

  const month = parseInt(match[1]);
  const day = parseInt(match[2]);
  const hour = parseInt(match[3]);
  const minute = parseInt(match[4]);

  let date = new Date(year, month - 1, day, hour, minute);

  // イベント日よりチケット発売日が後になる場合は、
  // 前年のチケット発売として扱う
  if(date > eventDateObj){
    date.setFullYear(year - 1);
  }

  return date;
}

function renderTodayEvent(){

  const box = document.getElementById("today-event");

  if(!box) return;

  const today = new Date();
  const todayStr =
  today.getFullYear() + "-" +
  String(today.getMonth()+1).padStart(2,"0") + "-" +
  String(today.getDate()).padStart(2,"0");

  const todayEvent = events.find(e => e.date === todayStr);

  if(todayEvent){

    box.innerHTML = `
    <div class="event-highlight-card"
     onclick="location.href='event.html?id=${todayEvent.id}'">

     <div class="highlight-content">

        <div class="highlight-text">
            <div class="highlight-label">📢 TODAY'S LIVE</div>
      
            <div class="highlight-title">
                ${todayEvent.title}
          </div>

        <div class="highlight-meta">
            📅 ${todayEvent.date}<br>
            📍 ${todayEvent.venue}
      </div>
    </div>

    ${
      todayEvent.images && todayEvent.images.length > 0
      ? `<div class="highlight-thumb">
           <img src="${todayEvent.images[0]}">
         </div>`
      : ""
    }
      
    </div>
    </div>
    `;

  }else{

    const future = events
      .filter(e => e.date > todayStr)
      .sort((a,b)=>a.date.localeCompare(b.date))[0];

    if(!future){
      box.innerHTML="";
      return;
    }

    box.innerHTML = `
<div class="event-highlight-card"
     onclick="location.href='event.html?id=${future.id}'">

  <div class="highlight-content">

    <div class="highlight-text">
      <div class="highlight-label">NEXT LIVE</div>

      <div class="highlight-title">
        ${future.title}
      </div>

      <div class="highlight-meta">
        📅 ${future.date}<br>
        📍 ${future.venue}
      </div>
    </div>

    ${
      future.images && future.images.length > 0
      ? `<div class="highlight-thumb">
           <img src="${future.images[0]}">
         </div>`
      : ""
    }

  </div>

</div>
`;
  }
}

function renderTicketCards(){

  const box = document.getElementById("ticket-start-list");

  if(!box) return;

  const now = new Date();

  // =========================
  // チケット情報抽出
  // =========================

  const ticketEvents = events
  .map(event => {

    const ticketDate = extractTicketDate(event.ticket, event.date);

    if(!ticketDate) return null;

    return {
      ...event,
      ticketDate
    };

  })
    .filter(Boolean)
    .sort((a,b)=>a.ticketDate - b.ticketDate);

  if(ticketEvents.length === 0){
    box.innerHTML = "";
    return;
  }

  // =========================
  // 今日の発売
  // =========================

  const todayTickets = ticketEvents.filter(t => {

    return (
      t.ticketDate.getFullYear() === now.getFullYear() &&
      t.ticketDate.getMonth() === now.getMonth() &&
      t.ticketDate.getDate() === now.getDate()
    );

  });

  // 時刻順
  todayTickets.sort((a,b)=>a.ticketDate - b.ticketDate);

  // =========================
  // 今後3件
  // =========================

  const todayStart = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

  const tomorrowStart = new Date(todayStart);
  tomorrowStart.setDate(tomorrowStart.getDate() + 1);

  const upcomingTickets = ticketEvents
    .filter(t => t.ticketDate >= tomorrowStart)
    .slice(0,3);

  let html = "";

  // =========================
  // TODAY TICKET
  // =========================

  if(todayTickets.length > 0){

    html += `
    <div class="event-highlight-card">

      <div class="highlight-content">

        <div class="highlight-text">

          <div class="highlight-label">
            🎫 本日発売のチケット
          </div>
    `;

          todayTickets.forEach(ticket => {

      html += `
      <div style="margin-top:12px;">

        <div class="highlight-content">

          <div class="highlight-text">

            <div class="highlight-title">
              ${ticket.title}
            </div>

            <div class="highlight-meta">
              ⏰ ${ticket.ticketDate.toLocaleTimeString("ja-JP",{
                hour:"2-digit",
                minute:"2-digit"
              })}<br>

              📅 LIVE ${ticket.date}<br>

              📍 ${ticket.venue || "会場未定"}
            </div>

            ${
            (ticket.ticketLink || ticket.ticketUrl)
            ? `
            <a href="${ticket.ticketLink || ticket.ticketUrl}"
            target="_blank"
            style="display:inline-block;margin-top:6px;">
            チケットはこちら
            </a>
            `
            : ""
            }

          </div>

          ${
            ticket.images && ticket.images.length > 0
            ? `
            <div class="highlight-thumb">
              <img src="${ticket.images[0]}">
            </div>
            `
            : ""
          }

        </div>

      </div>
      `;

    });

    html += `
        </div>
      </div>
    </div>
    `;
  }

  // =========================
  // UPCOMING
  // =========================

  if(upcomingTickets.length > 0){

    html += `
    <div class="event-highlight-card"
         style="margin-top:14px;">

      <div class="highlight-content">

        <div class="highlight-text">

          <div class="highlight-label">
            🎫 UPCOMING TICKETS
          </div>
    `;
    
    upcomingTickets.forEach(ticket => {
      
      html += `
  <div style="
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid rgba(0,0,0,0.08);
  ">

    <div class="highlight-title">
      ${ticket.ticketDate.toLocaleDateString("ja-JP",{
        month:"numeric",
        day:"numeric"
      })}
      ${ticket.ticketDate.toLocaleTimeString("ja-JP",{
        hour:"2-digit",
        minute:"2-digit"
      })}
     　${ticket.title}
    </div>

    <div class="highlight-meta">
      📅 LIVE ${ticket.date}
     　📍 ${ticket.venue || "会場未定"}
    </div>

  </div>
  `;

});

    html += `
        </div>
      </div>
    </div>
    `;
  }

  box.innerHTML = html;
}

</script>

</body>
</html>
